body{margin:0;background:#333;display:flex;gap:12px;padding:12px;align-items:flex-start}

<script>
// usage: setOffsets([0,800,1600,2400])
window.setOffsets=function(a){[...document.querySelectorAll('iframe')].forEach((f,i)=>{try{f.contentWindow.document.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));f.contentWindow.scrollTo(0,a[i]||0)}catch(e){}})}
